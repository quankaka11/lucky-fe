server {
    listen 80;
    server_name localhost;

    # ── Serve Frontend (React SPA) ────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback – mọi route không tìm thấy file → trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse Proxy tới AI-Core Backend ─────────────────────
    # Mọi request /api/* sẽ được forward tới container ai-core
    location /api/ {
        proxy_pass         http://ai-core:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout cho AI calls (Azure OpenAI có thể mất 10-20s)
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── Cache static assets ──────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
